[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "errorlens"
dynamic = ["version"]
description = "Automatic, statistically rigorous failure-pattern discovery for tabular ML models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dheer", email = "dheer092006@gmail.com" }]
keywords = [
    "machine-learning",
    "error-analysis",
    "model-debugging",
    "subgroup-discovery",
    "slice-finding",
    "model-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "click>=8.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
pdf = ["reportlab>=3.6", "matplotlib>=3.5"]
all = ["matplotlib>=3.5", "reportlab>=3.6", "pyarrow>=10"]
test = ["pytest>=7.0", "pypdf>=3.0", "matplotlib>=3.5", "reportlab>=3.6"]
dev = [
    "pytest>=7.0",
    "pypdf>=3.0",
    "matplotlib>=3.5",
    "reportlab>=3.6",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
]

[project.scripts]
errorlens = "errorlens.cli.main:main"

[project.urls]
Homepage = "https://github.com/Dheer46/errorlens"
Documentation = "https://github.com/Dheer46/errorlens#readme"
Changelog = "https://github.com/Dheer46/errorlens/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dheer46/errorlens/issues"

[tool.hatch.version]
path = "errorlens/_version.py"

[tool.hatch.build.targets.sdist]
include = ["errorlens", "tests", "examples", "*.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["errorlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: longer-running performance tests"]
filterwarnings = ["error::FutureWarning:errorlens.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "B905", "RUF046"]

[tool.ruff.lint.isort]
known-first-party = ["errorlens", "_data", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018"]

[tool.mypy]
python_version = "3.10"
packages = ["errorlens"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
